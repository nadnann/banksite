name: PHP 8.2 Compatibility Check

on:
  workflow_dispatch:

jobs:
  rector:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Show PHP version
        run: php -v

      - name: Create temporary Composer project
        run: |
          composer init --no-interaction

      - name: Install Rector
        run: |
          composer require --dev rector/rector:2.6.6 --no-interaction --prefer-dist

      - name: Run Rector - dry run
        continue-on-error: true
        run: |
          vendor/bin/rector process --dry-run --output-format=console 2>&1 | tee rector-output.txt

      - name: Upload Rector report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rector-report
          path: rector-output.txt
          if-no-files-found: warn
