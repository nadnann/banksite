name: PHP 8.2 Compatibility Check

on:
  workflow_dispatch:

jobs:
  rector:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Show PHP version
        run: php -v

      - name: Create Composer project
        run: |
          composer init --no-interaction

      - name: Install Rector
        run: |
          composer require --dev rector/rector --no-interaction --prefer-dist

      - name: Run Rector dry-run
        run: |
          set +e
          vendor/bin/rector process --dry-run --output-format=console > rector-output.txt 2>&1
          RECTОR_EXIT_CODE=$?
          echo "Rector exit code: $RECTОR_EXIT_CODE"

          echo ""
          echo "========== RECTOR OUTPUT =========="
          cat rector-output.txt
          echo "========== END RECTOR OUTPUT =========="

          exit 0

      - name: Upload Rector report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rector-php82-report
          path: rector-output.txt
          if-no-files-found: warn
