name: Upgrade to PHP 8.2

on:
  workflow_dispatch: # Actions sekmesinden manuel tetiklemek için

jobs:
  rector:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: rector

      - name: Run Rector
        run: rector process

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "refactor: upgrade code to PHP 8.2"
          title: "Upgrade to PHP 8.2 with Rector"
          body: "This PR automatically refactors deprecated PHP 7.2 syntax to PHP 8.2 using Rector."
          branch: "upgrade-php-8-2"
